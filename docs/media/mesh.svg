<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t-mesh">
<title id="t-mesh">Neural mesh: every neuron talks to its neighbours and signals flow between them</title>
<defs>
<linearGradient id="bg-mesh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1216"/><stop offset="1" stop-color="#110c0e"/></linearGradient>
<radialGradient id="glow-mesh"><stop offset="0" stop-color="#e3a99d" stop-opacity=".35"/><stop offset="1" stop-color="#e3a99d" stop-opacity="0"/></radialGradient>

</defs>
<style>
text{font-family:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f8ede9}
.dim{fill:rgba(248,237,233,.62)}
.line{fill:none;stroke:rgba(255,228,218,.2);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes flow{to{stroke-dashoffset:-24}}@keyframes pulse{0%,100%{fill:#c98476;r:8}50%{fill:#efd0c8;r:11}}
.sig{fill:none;stroke:#e3a99d;stroke-width:2.5;stroke-dasharray:4 20;stroke-linecap:round;animation:flow 1.6s linear infinite}
.node{fill:#c98476;animation:pulse 3s ease-in-out infinite}
</style>
<rect width="480" height="300" rx="32" fill="url(#bg-mesh)"/>
<rect x=".75" y=".75" width="478.5" height="298.5" rx="31.5" fill="none" stroke="rgba(255,228,218,.2)"/>
<g transform="translate(0,-8)"><line x1="90" y1="90" x2="150" y2="130" class="line"/><line x1="90" y1="90" x2="150" y2="130" class="sig" style="animation-delay:0.00s"/><line x1="90" y1="170" x2="150" y2="130" class="line"/><line x1="90" y1="170" x2="150" y2="130" class="sig" style="animation-delay:0.23s"/><line x1="150" y1="130" x2="200" y2="70" class="line"/><line x1="150" y1="130" x2="200" y2="70" class="sig" style="animation-delay:0.46s"/><line x1="150" y1="130" x2="200" y2="190" class="line"/><line x1="150" y1="130" x2="200" y2="190" class="sig" style="animation-delay:0.69s"/><line x1="200" y1="70" x2="260" y2="130" class="line"/><line x1="200" y1="70" x2="260" y2="130" class="sig" style="animation-delay:0.92s"/><line x1="200" y1="190" x2="260" y2="130" class="line"/><line x1="200" y1="190" x2="260" y2="130" class="sig" style="animation-delay:1.15s"/><line x1="260" y1="130" x2="320" y2="80" class="line"/><line x1="260" y1="130" x2="320" y2="80" class="sig" style="animation-delay:1.38s"/><line x1="260" y1="130" x2="320" y2="180" class="line"/><line x1="260" y1="130" x2="320" y2="180" class="sig" style="animation-delay:1.61s"/><line x1="320" y1="80" x2="390" y2="130" class="line"/><line x1="320" y1="80" x2="390" y2="130" class="sig" style="animation-delay:1.84s"/><line x1="320" y1="180" x2="390" y2="130" class="line"/><line x1="320" y1="180" x2="390" y2="130" class="sig" style="animation-delay:2.07s"/><line x1="200" y1="70" x2="240" y2="40" class="line"/><line x1="200" y1="70" x2="240" y2="40" class="sig" style="animation-delay:2.30s"/><line x1="200" y1="190" x2="240" y2="220" class="line"/><line x1="200" y1="190" x2="240" y2="220" class="sig" style="animation-delay:2.53s"/><line x1="240" y1="40" x2="320" y2="80" class="line"/><line x1="240" y1="40" x2="320" y2="80" class="sig" style="animation-delay:2.76s"/><line x1="240" y1="220" x2="320" y2="180" class="line"/><line x1="240" y1="220" x2="320" y2="180" class="sig" style="animation-delay:2.99s"/><line x1="90" y1="90" x2="200" y2="70" class="line"/><line x1="90" y1="90" x2="200" y2="70" class="sig" style="animation-delay:3.22s"/><line x1="90" y1="170" x2="200" y2="190" class="line"/><line x1="90" y1="170" x2="200" y2="190" class="sig" style="animation-delay:3.45s"/><circle cx="90" cy="90" r="9" class="node" style="animation-delay:0.00s"/><circle cx="90" cy="170" r="9" class="node" style="animation-delay:0.31s"/><circle cx="150" cy="130" r="9" class="node" style="animation-delay:0.62s"/><circle cx="200" cy="70" r="9" class="node" style="animation-delay:0.93s"/><circle cx="200" cy="190" r="9" class="node" style="animation-delay:1.24s"/><circle cx="260" cy="130" r="9" class="node" style="animation-delay:1.55s"/><circle cx="320" cy="80" r="9" class="node" style="animation-delay:1.86s"/><circle cx="320" cy="180" r="9" class="node" style="animation-delay:2.17s"/><circle cx="390" cy="130" r="9" class="node" style="animation-delay:2.48s"/><circle cx="240" cy="40" r="9" class="node" style="animation-delay:2.79s"/><circle cx="240" cy="220" r="9" class="node" style="animation-delay:3.10s"/></g>
<text x="240" y="276" text-anchor="middle" font-size="15" class="dim">Neural mesh: every neuron talks to every other</text>
</svg>
