<circle cx="221.4" cy="117.0" r="5.1" fill="#f8f2e6"/><circle cx="221.4" cy="117.0" r="2.6" fill="#1a1013"/><circle cx="259.8" cy="121.2" r="4.2" fill="#f8f2e6"/><circle cx="259.8" cy="121.2" r="2.1" fill="#1a1013"/><circle cx="217.8" cy="135.6" r="3.3" fill="#f8f2e6"/><circle cx="217.8" cy="135.6" r="1.6" fill="#1a1013"/><circle cx="261.0" cy="140.4" r="3.6" fill="#f8f2e6"/><circle cx="261.0" cy="140.4" r="1.8" fill="#1a1013"/>
