<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t-ext">
<title id="t-ext">Extensions and skills plug into the mesh and become part of it</title>
<defs>
<linearGradient id="bg-ext" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1216"/><stop offset="1" stop-color="#110c0e"/></linearGradient>
<radialGradient id="glow-ext"><stop offset="0" stop-color="#e3a99d" stop-opacity=".35"/><stop offset="1" stop-color="#e3a99d" stop-opacity="0"/></radialGradient>

</defs>
<style>
text{font-family:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f8ede9}
.dim{fill:rgba(248,237,233,.62)}
.line{fill:none;stroke:rgba(255,228,218,.2);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes plug{0%{opacity:0;transform:translate(0,0) scale(.8)}8%{opacity:1}40%{opacity:1;transform:translate(var(--fx),var(--fy)) scale(.5)}50%,100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.2)}}
@keyframes ping{0%,35%{r:56;opacity:0}45%{opacity:.7}70%,100%{r:86;opacity:0}}
.blk{opacity:0;animation:plug 4.8s ease-in-out infinite}
.ping{fill:none;stroke:#8fe3a8;stroke-width:2;animation:ping 4.8s ease-out infinite}
</style>
