<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t-bits">
<title id="t-bits">Raw bits flowing into the mesh with no tokenizer</title>
<defs>
<linearGradient id="bg-bits" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1216"/><stop offset="1" stop-color="#110c0e"/></linearGradient>
<radialGradient id="glow-bits"><stop offset="0" stop-color="#e3a99d" stop-opacity=".35"/><stop offset="1" stop-color="#e3a99d" stop-opacity="0"/></radialGradient>

</defs>
<style>
text{font-family:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f8ede9}
.dim{fill:rgba(248,237,233,.62)}
.line{fill:none;stroke:rgba(255,228,218,.2);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(560px)}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bit{fill:#e3a99d;letter-spacing:2px;animation:run 6s linear infinite;opacity:.85;font-family:ui-monospace,Menlo,Consolas,monospace}
.core{transform-origin:400px 130px;animation:beat 1.6s ease-in-out infinite}
</style>
